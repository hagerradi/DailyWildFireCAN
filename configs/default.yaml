# Hyper-parameters used for every model in the paper (Appendix B).
# The architecture can be overridden on the command line with --arch.
seed: 42

dataset:
  height: 256
  width: 256
  channels: 50
  num_classes: 1

model:
  # unet, unet_time_gap, unet_attention, unet_segformer, asufm, umamba, unet_olmo_offline,
  # dual_dinov3 (mono-temporal) | unet_convlstm, utae, simvpv2_spatiotemporal,
  # video_swin_unet, frp (multi-temporal)
  architecture: "unet"
  input_channels: 50
  num_classes: 1
  hidden_features: [64, 128, 256, 512]
  use_skip_connections: true
  use_activation_after_upsampling: false

training:
  batch_size: 16
  num_epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 4
  device: "auto"          # auto, cuda, mps or cpu
  checkpoint_dir: "checkpoints_unet"
  log_interval: 10

comet:
  enabled: false          # set to true and export COMET_API_KEY to log to Comet
  project_name: ""
  workspace: ""
  experiment_name: "unet"
  experiment_tags: []
